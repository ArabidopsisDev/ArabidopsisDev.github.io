<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="1000" height="850" role="img" aria-labelledby="title desc">
<title id="title">RUP 的阶段、迭代与工作类别</title>
<desc id="desc">项目按初始、细化、构建和移交阶段推进。每个阶段内部安排迭代，需求、设计、实现、测试和交付准备会随阶段目标继续进行。阶段结束时评审是否继续。</desc>
<style>text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#173f35}.phase{font-size:25px;font-weight:650}.en{font-size:15px;fill:#60705c}.body{font-size:17px;fill:#435a42}.label{font-size:18px;font-weight:600}.small{font-size:16px;fill:#556a4d}</style>
