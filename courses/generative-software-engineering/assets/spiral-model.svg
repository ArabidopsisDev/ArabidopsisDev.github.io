  <path d="M460 128V722"/><path d="M128 410H805"/>
</g>
<g>
  <text class="phase" x="30" y="42">1  明确目标、方案与约束</text>
  <text class="detail" x="30" y="72">希望换到另一台设备仍能接着复习。</text>
  <text class="detail" x="30" y="98">比较文件搬运、覆盖、合并和版本检查。</text>
  <text class="phase" x="508" y="42">2  分析并减少风险</text>
  <text class="detail" x="508" y="72">先后提交两份记录，观察进度是否丢失。</text>
  <text class="detail" x="508" y="98">用试验比较方案，记下仍未解决的问题。</text>
  <text class="phase" x="508" y="772">3  开发与验证</text>
  <text class="detail" x="508" y="802">依据试验结果，实现当前周期的方案。</text>
  <text class="detail" x="508" y="828">补充过时提交的提示，测试实际改动。</text>
  <text class="phase" x="30" y="772">4  审阅结果，安排后续</text>
  <text class="detail" x="30" y="802">开发者与使用者一起评审当前结果。</text>
  <text class="detail" x="30" y="828">讨论后续投入，确定下个周期的目标。</text>
</g>
