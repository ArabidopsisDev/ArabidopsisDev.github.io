<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" width="900" height="850" role="img" aria-labelledby="title desc">
<title id="title">风险驱动的螺旋模型</title>
<desc id="desc">螺旋从起点顺时针向外展开，每圈表示一个开发周期。每个周期中，开发者确定目标和可选方案，通过试验分析风险，再依据结果实现和验证当前方案。周期结束时评审结果，决定是否继续下一个开发周期。曲线向外展开表示累计投入增加。</desc>
<defs>
  <marker id="continue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#173f35" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="pause" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L9 5 1 9" fill="none" stroke="#946837" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<style>
text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; fill: #173f35; }
.phase { font-size: 23px; font-weight: 650; }
.detail { font-size: 16px; fill: #52664f; }
.label { font-size: 15px; }
</style>
