<svg xmlns="http://www.w3.org/2000/svg" width="860" height="580" viewBox="0 0 860 580" font-family="Times New Roman, SimSun" font-style="normal">
  <title>KI过量时的AgI胶团结构</title>
  <desc>碘化银胶核吸附碘离子，吸附层和扩散层中的反离子均为钾离子。胶粒带负电，整个胶团电中性。离子位置与数量为示意。</desc>
  <rect x="0" y="0" width="860" height="580" fill="white" />
  <text x="430" y="32" text-anchor="middle" font-size="21"><tspan>KI </tspan><tspan font-family="SimSun" font-style="normal">过量</tspan></text>

  <g stroke="black" fill="none">
    <circle cx="280" cy="266" r="220" stroke-width="1.2" stroke-dasharray="7 5" />
    <circle cx="280" cy="266" r="164" stroke-width="1.5" stroke-dasharray="4 4" />
    <circle cx="280" cy="266" r="76" stroke-width="1.8" />
  </g>

  <text x="280" y="264" text-anchor="middle" font-size="27"><tspan>(AgI)</tspan><tspan dy="7" font-size="18" font-style="italic">m</tspan></text>
  <text x="280" y="294" text-anchor="middle" font-size="17" font-family="SimSun" font-style="normal">胶核</text>

  <g font-size="23" text-anchor="middle">
    <text x="280" y="170">I<tspan dy="-8" font-size="15">−</tspan></text>
    <text x="353" y="200">I<tspan dy="-8" font-size="15">−</tspan></text>
    <text x="383" y="273">I<tspan dy="-8" font-size="15">−</tspan></text>
    <text x="353" y="346">I<tspan dy="-8" font-size="15">−</tspan></text>
    <text x="280" y="376">I<tspan dy="-8" font-size="15">−</tspan></text>
    <text x="207" y="346">I<tspan dy="-8" font-size="15">−</tspan></text>
    <text x="177" y="273">I<tspan dy="-8" font-size="15">−</tspan></text>
    <text x="207" y="200">I<tspan dy="-8" font-size="15">−</tspan></text>
  </g>

  <g font-size="23" text-anchor="middle">
    <text x="280" y="130">K<tspan dy="-8" font-size="15">+</tspan></text>
    <text x="423" y="273">K<tspan dy="-8" font-size="15">+</tspan></text>
    <text x="280" y="416">K<tspan dy="-8" font-size="15">+</tspan></text>
    <text x="137" y="273">K<tspan dy="-8" font-size="15">+</tspan></text>

    <text x="141" y="134">K<tspan dy="-8" font-size="15">+</tspan></text>
    <text x="419" y="134">K<tspan dy="-8" font-size="15">+</tspan></text>
    <text x="141" y="412">K<tspan dy="-8" font-size="15">+</tspan></text>
    <text x="419" y="412">K<tspan dy="-8" font-size="15">+</tspan></text>
  </g>

  <g stroke="black" stroke-width="1.2" fill="none">
    <polyline points="365,191 472,160 540,160" />
    <polyline points="436,263 490,230 540,230" />
    <polyline points="433,402 491,370 540,370" />
    <polyline points="441,296 500,300 540,300" />
    <polyline points="367,248 477,95 540,95" />
  </g>
  <g font-size="19">
    <text x="554" y="101"><tspan font-family="SimSun" font-style="normal">胶核：</tspan><tspan>(AgI)</tspan><tspan dy="5" font-size="14" font-style="italic">m</tspan></text>
    <text x="554" y="166"><tspan font-family="SimSun" font-style="normal">电位离子：</tspan><tspan font-style="italic">n</tspan><tspan>I</tspan><tspan dy="-7" font-size="14">−</tspan></text>
    <text x="554" y="236"><tspan font-family="SimSun" font-style="normal">吸附层反离子：</tspan><tspan>(</tspan><tspan font-style="italic">n</tspan><tspan> − </tspan><tspan font-style="italic">x</tspan><tspan>)K</tspan><tspan dy="-7" font-size="14">+</tspan></text>
    <text x="554" y="306" font-family="SimSun" font-style="normal">胶粒边界（带负电）</text>
    <text x="554" y="376"><tspan font-family="SimSun" font-style="normal">扩散层反离子：</tspan><tspan font-style="italic">x</tspan><tspan>K</tspan><tspan dy="-7" font-size="14">+</tspan></text>
  </g>

  <text x="600" y="453" font-size="16" font-family="SimSun" font-style="normal">离子数量与位置为示意</text>
  <text x="430" y="541" text-anchor="middle" font-size="26">
    <tspan>{(AgI)</tspan><tspan dy="7" font-size="18" font-style="italic">m</tspan><tspan dy="-7"> · </tspan><tspan font-style="italic">n</tspan><tspan>I</tspan><tspan dy="-10" font-size="18">−</tspan><tspan dy="10"> · (</tspan><tspan font-style="italic">n</tspan><tspan> − </tspan><tspan font-style="italic">x</tspan><tspan>)K</tspan><tspan dy="-10" font-size="18">+</tspan><tspan dy="10">}</tspan><tspan dy="-13" font-size="18" font-style="italic">x</tspan><tspan font-size="18">−</tspan><tspan dy="13"> · </tspan><tspan font-style="italic">x</tspan><tspan>K</tspan><tspan dy="-10" font-size="18">+</tspan>
  </text>
</svg>